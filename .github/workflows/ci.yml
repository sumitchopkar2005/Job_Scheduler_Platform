name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d scheduler"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scheduler?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-with-at-least-32-characters-long
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Push database schema
        run: npm run db:push
      - name: Backend tests
        run: npm test
        env:
          RUN_DB_TESTS: "1"
      - name: Worker tests
        run: npm run test:integration
      - name: Frontend build
        run: npm run build --workspace frontend
